hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - training.overfit_video_index=0
    - training.epochs=100
    - training.lr=3e-4
    - training.lr_warmup_epochs=0
    - training.training_solver_steps=5
    - training.autoregressive_rollout_steps=8
    - training.autoregressive_detach_between_steps=false
    - training.sequence_encode_batch_size=2
    - training.lambda_del=0.05
    - training.inference_every=10
    - training.save_inference_video=true
    - training.save_final_inference=true
    - wandb.enabled=false
  job:
    name: train
    chdir: null
    override_dirname: training.autoregressive_detach_between_steps=false,training.autoregressive_rollout_steps=8,training.epochs=100,training.inference_every=10,training.lambda_del=0.05,training.lr=3e-4,training.lr_warmup_epochs=0,training.overfit_video_index=0,training.save_final_inference=true,training.save_inference_video=true,training.sequence_encode_batch_size=2,training.training_solver_steps=5,wandb.enabled=false
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /storage/home/hcoda1/8/lwang831/workspace/Dialga
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /storage/home/hcoda1/8/lwang831/workspace/Dialga/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /storage/home/hcoda1/8/lwang831/workspace/Dialga/outputs/2026-04-14/15-47-07
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
