defaults:
  - _self_

dataset:
  data_dir: "/storage/project/r-agarg35-0/lwang831/dataset/CLEVRER/train_video"
  video_num_frames: 128

model:
  # Stage 1 only supports the learned LeWM-style encoder.
  latent_source: "lewm_patch"
  # Recommended debug baseline: `direct_predictor`
  # Structured experiment path: `lagrangian`
  dynamics_model: "direct_predictor"

  input_image_size: 128
  lewm_patch_size: 16
  lewm_embed_dim: 192
  lewm_latent_channels: 48
  lewm_encoder_depth: 4
  lewm_num_heads: 6
  lewm_mlp_ratio: 4.0

  predictor_hidden_channels: 256
  predictor_num_blocks: 4

  patch_size: 2
  hidden_size: 256
  depth: 4
  num_heads: 8
  action_dim: 0

training:
  batch_size: 32
  num_workers: 4
  train_subset_size: 0

  sequence_window_length: 6
  sequence_windows_per_video: 4
  sequence_max_videos: 0

  val_fraction: 0.01
  val_batch_size: 32
  val_num_workers: 2
  val_every: 1
  val_every_steps: 1000
  val_max_batches: 8

  seed: 0
  lr: 0.0003
  lr_warmup_epochs: 0
  use_scheduler: true
  weight_decay: 0.00001
  epochs: 100
  log_interval: 50
  device: "cuda"
  grad_clip_norm: 1.0

  # Lagrangian-only settings
  solver_alpha: 0.1
  training_solver_steps: 1

  # Stage 1 losses: predictive objectives dominate; DEL is optional and weak.
  lambda_solver_mse: 1.0
  lambda_del: 0.0
  lambda_sigreg: 0.0
  sigreg_knots: 17
  sigreg_num_proj: 256

  checkpoint_every: 10
  save_last_checkpoint: true

wandb:
  enabled: true
  project: "dialga"
  entity: null
  name: null
  group: null
  job_type: "train_state"
  mode: "online"
  tags: []
