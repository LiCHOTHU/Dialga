defaults:
  - _self_

dataset:
  # This can point to either extracted frame folders or the raw CLEVRER train_video tree.
  data_dir: "/storage/project/r-agarg35-0/lwang831/dataset/CLEVRER/train_video"
  video_num_frames: 128

model:
  vae_ckpt: "/storage/cedar/cedar0/cedarp-agarg35-0/liquan.w/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
  latent_source: "wan_vae"
  # Use `direct_predictor` as the simplest debug baseline. Keep `lagrangian`
  # for structured experiments once the representation/prediction stack behaves.
  dynamics_model: "lagrangian"
  # `identity` is the recommended default. `projected_sigreg` is an optional
  # ablation and is not currently a proven win.
  representation: "identity"
  state_projector_hidden_channels: 128
  predictor_hidden_channels: 256
  predictor_num_blocks: 4
  input_image_size: 128
  dino_model_name: "dinov2_vits14"
  dino_input_size: 126
  dino_latent_channels: 64
  dinov2_variant: "dinov2_vits14"
  dinov2_image_size: 224
  lewm_patch_size: 16
  lewm_embed_dim: 192
  lewm_latent_channels: 48
  lewm_encoder_depth: 4
  lewm_num_heads: 6
  lewm_mlp_ratio: 4.0
  latent_channels: 16
  latent_h: 16
  latent_w: 16
  patch_size: 2
  hidden_size: 256
  depth: 4
  num_heads: 8
  action_dim: 0

training:
  batch_size: 32
  num_workers: 4
  train_subset_size: 0
  sequence_window_length: 6
  sequence_windows_per_video: 4
  sequence_max_videos: 0
  val_fraction: 0.01
  val_batch_size: 32
  val_num_workers: 2
  val_every: 1
  val_every_steps: 1000
  val_max_batches: 8
  seed: 0
  overfit_subset_size: 0
  overfit_video_index: -1
  overfit_shuffle: false
  overfit_num_workers: 0
  # Higher-order DEL gradients are not safe with checkpointed transformer blocks.
  gradient_checkpointing: false
  lr: 0.0003
  lr_warmup_epochs: 0
  use_scheduler: true
  weight_decay: 0.00001
  epochs: 100
  log_interval: 10
  device: "cuda"
  grad_clip_norm: 1.0
  solver_alpha: 0.1
  solver_steps: 5
  training_solver_steps: 1
  # For the current latent-video path, predictive losses should dominate. DEL is
  # kept as a weak structural regularizer rather than the main signal.
  lambda_del: 0.1
  # Practical default after debugging: keep a small DEL term, but let direct prediction dominate.
  lambda_solver_mse: 1.0
  lambda_recon: 0.0
  lambda_pred_recon: 0.0
  lambda_sigreg: 0.0
  sigreg_knots: 17
  sigreg_num_proj: 256
  solver_microbatch_size: 1
  autoregressive_rollout_steps: 0
  autoregressive_detach_between_steps: true
  sequence_encode_batch_size: 1
  diagnostics_every: 10
  checkpoint_every: 10
  checkpoint_every_steps: 2000
  save_last_checkpoint: true
  vae_reconstruction_check_frames: 4
  vae_reconstruction_warn_mse: 0.05
  inference_every: 1
  inference_every_steps: 1000
  save_inference_images: true
  save_inference_video: true
  save_final_inference: true
  inference_video_index: -1
  inference_video_max_frames: 128
  inference_sparse_frames: 8
  inference_video_fps: 12
  inference_video_hold_frames: 8

wandb:
  enabled: true
  project: "dialga"
  entity: null
  name: null
  group: null
  job_type: "train"
  mode: "online"
  tags: []
