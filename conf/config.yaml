  epochs: 100
  log_interval: 10
  device: "cuda"
  grad_clip_norm: 1.0
  solver_alpha: 0.1
  solver_steps: 5
  training_solver_steps: 1
  lambda_del: 1.0
  solver_microbatch_size: 4
  autoregressive_rollout_steps: 0
